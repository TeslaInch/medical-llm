name: CI/CD Pipeline - Test and Deploy to HuggingFace

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install with pre-compiled llama-cpp-python to save build time
        pip install -r api/requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
        
    - name: Run Pytest
      run: |
        cd api
        python -m pytest tests/ -v
        
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install HuggingFace Hub
      run: pip install huggingface_hub python-dotenv
      
    - name: Deploy to HuggingFace Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Use our custom deployment script
        python scripts/deploy_to_hf_spaces.py
